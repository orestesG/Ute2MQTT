name: "Ute2MQTT"
version: "1.3.0"
slug: "ute2mqtt"
description: >-
  Integra tu medidor inteligente de UTE con Home Assistant. Publica consumo
  actual (kWh), gasto estimado en pesos, deuda y desglose por franja horaria
  (Punta / Llano / Valle) vía MQTT con auto-descubrimiento. Soporta tarifas
  TRT, TRD y TRS. Se autentica automáticamente con el portal de UTE y
  programa las actualizaciones en una ventana horaria configurable.
url: "https://github.com/orestesG/Ute2MQTT"
arch:
  - aarch64
  - amd64
  - armv7
  - armhf
init: false
startup: services
boot: auto

map:
  - config:ro

options:
  ute_username: ""
  ute_password: ""
  ute_account_id: ""
  ute_service_id: ""
  ute_service_point_id: ""
  ute_tariff: "TRS"
  encryption_key: ""
  mqtt_broker: "core-mosquitto"
  mqtt_port: 1883
  mqtt_topic_prefix: "UTE"
  mqtt_discovery_prefix: "homeassistant"
  mqtt_client_id: "ute2mqtt"
  schedule_time: "AM"
  schedule_interval_hours: 0

schema:
  ute_username: str
  ute_password: password
  ute_account_id: str
  ute_service_id: str
  ute_service_point_id: str
  ute_tariff: "list(TRT|TRD|TRS|TGS)"
  ute_schedule_code: str?
  encryption_key: str
  mqtt_broker: str
  mqtt_port: int
  mqtt_username: str?
  mqtt_password: password?
  mqtt_topic_prefix: str
  mqtt_discovery_prefix: str
  mqtt_client_id: str
  schedule_time: "list(AM|PM)"
  schedule_interval_hours: float
